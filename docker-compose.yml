services:
  db:
    container_name: postgres-db
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-summer_practice}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-summer_practice}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: shop-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-summer_practice}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-summer-practice-secret-change-me}
      DEBUG: ${DEBUG:-false}
      SEED_DB: ${SEED_DB:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # При первом запуске можно раскомментировать SEED_DB=true в .env,
    # чтобы автоматически заполнить БД тестовыми данными.
    # Таблицы создаются автоматически при старте (init_db в main.py).

volumes:
  pgdata:
